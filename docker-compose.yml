services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epa_conciliacao}
      POSTGRES_USER: ${POSTGRES_USER:-epa_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epa_app} -d ${POSTGRES_DB:-epa_conciliacao}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-epa_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-epa_conciliacao}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      AUTH_MODE: ${AUTH_MODE:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      STORAGE_PATH: /app/storage
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  postgres_data:
  uploads:
